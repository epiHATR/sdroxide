<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: installed full screen, the page owns the whole
         panel including the area behind a notch or rounded corners. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sdroxide</title>
    <!-- Installed to a home screen ("Add to Home screen"), the manifest is what
         makes this open with no address bar and no toolbars. A tablet browser
         otherwise keeps its chrome for good: the page sets overflow:hidden so a
         drag pans the waterfall, so it never scrolls, so the toolbar never
         auto-hides and a third of the panel is browser. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS honours none of the manifest: these are its equivalents. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="sdroxide" />
    <link rel="apple-touch-icon" href="sdroxide-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="sdroxide-192.png" />
    <!-- data-initializer: progress UI while the fingerprinted wasm downloads
         (Trunk 0.19+). See initializer.mjs. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-initializer="initializer.mjs" />
    <link data-trunk rel="copy-file" href="assets/audio_bridge.js" />
    <link data-trunk rel="copy-file" href="assets/pcm_worklet.js" />
    <link data-trunk rel="copy-file" href="assets/ws_arraybuffer.js" />
    <link data-trunk rel="copy-file" href="assets/wake_lock.js" />
    <link data-trunk rel="copy-file" href="assets/manifest.json" />
    <!-- The icons the manifest names, from the one source every other platform
         renders from (packaging/icons/sdroxide.svg via render.sh). -->
    <link data-trunk rel="copy-file" href="../../packaging/icons/sdroxide-192.png" />
    <link data-trunk rel="copy-file" href="../../packaging/icons/sdroxide-512.png" />
    <!-- Must run before the wasm opens its socket. -->
    <script src="ws_arraybuffer.js"></script>
    <script src="audio_bridge.js"></script>
    <!-- Keeps a watched panel from blanking; see the file for why it is safe to
         run unconditionally. -->
    <script src="wake_lock.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            /* A drag across the canvas is a waterfall pan, not a text
               selection. Without this WebKit starts selecting the document and
               washes the whole page in the blue selection tint. */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            /* No rubber-banding or pull-to-refresh on a full-screen app. */
            overscroll-behavior: none;
        }
        body {
            /* Installed full screen, `viewport-fit=cover` and iOS's
               `black-translucent` hand the page the area behind the status bar,
               the notch and the home indicator. Keep the panel inside the safe
               area and let the background fill the rest — a control under the
               notch cannot be pressed. `env()` is 0 where there is no inset, so
               a tablet, a desktop browser and Android are unchanged. */
            box-sizing: border-box;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            /* Every gesture belongs to egui: no panning, pinch-zoom or
               double-tap-zoom stolen by the browser. */
            touch-action: none;
        }
        /* eframe drives the on-screen keyboard through a hidden input, which
           still needs real selection to edit text in. */
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* Shown until Trunk's initializer reports wasm success. */
        #sdroxide-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #0a0a0a;
            color: #e8e8e8;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #sdroxide-loader[hidden] {
            display: none !important;
        }
        #sdroxide-loader-brand {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #ffd142;
        }
        #sdroxide-loader-status {
            font-size: 0.95rem;
            color: #b0b0b0;
            text-align: center;
            max-width: 22rem;
        }
        #sdroxide-loader-track {
            width: min(20rem, 80vw);
            height: 0.4rem;
            border-radius: 999px;
            background: #1e1e1e;
            overflow: hidden;
        }
        #sdroxide-loader-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: #ffd142;
            transition: width 0.12s ease-out;
        }
        #sdroxide-loader-bar.indeterminate {
            animation: sdroxide-loader-slide 1.1s ease-in-out infinite;
        }
        @keyframes sdroxide-loader-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        #sdroxide-loader-pct {
            font-size: 0.8rem;
            color: #888;
            min-height: 1.2em;
        }
        #sdroxide-loader-error {
            font-size: 0.85rem;
            color: #ff8a8a;
            text-align: center;
            max-width: 24rem;
            word-break: break-word;
        }
        #sdroxide-loader-retry {
            margin-top: 0.5rem;
            padding: 0.55rem 1.25rem;
            border: 1px solid #ffd142;
            border-radius: 4px;
            background: transparent;
            color: #ffd142;
            font-size: 0.95rem;
            cursor: pointer;
        }
        #sdroxide-loader-retry:hover {
            background: rgba(255, 209, 66, 0.12);
        }
    </style>
</head>
<body>
    <div id="sdroxide-loader" role="status" aria-live="polite">
        <div id="sdroxide-loader-brand">sdroxide</div>
        <div id="sdroxide-loader-status">Loading client…</div>
        <div id="sdroxide-loader-track">
            <div id="sdroxide-loader-bar" class="indeterminate"></div>
        </div>
        <div id="sdroxide-loader-pct"></div>
        <div id="sdroxide-loader-error" hidden></div>
        <button type="button" id="sdroxide-loader-retry" hidden
                onclick="location.reload()">Retry</button>
    </div>
    <canvas id="sdroxide_canvas"></canvas>
</body>
</html>
